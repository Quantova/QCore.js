[graph]
all-features = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    "k256",
    "ed25519-dalek",
    "curve25519-dalek",
    "p256",
    "secp256k1",
    "rsa",
    "bls12_381",
    "ark-ec",
    "ark-bls12-381",
    "ark-groth16",
    "pairing",
    "openssl",
    "openssl-sys",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
github = ["Quantova"]
