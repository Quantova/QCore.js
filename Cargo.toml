[package]
name = "qcore-js"
version = "0.11.8"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The JavaScript binding for the Quantova client core, generated over QCore with wasm-bindgen. The core does the key derivation, the post quantum signing, and the wire, the page does the fetch."
repository = "https://github.com/Quantova/QCore.js"

[lib]
crate-type = ["cdylib"]

[dependencies]
qcore = { path = "../QCore.rs", default-features = false }
wasm-bindgen = "0.2"
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "4f91c2f7471378150f9dbce0ce5f2e05b80c0cb9" }

[dev-dependencies]
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "4f91c2f7471378150f9dbce0ce5f2e05b80c0cb9" }

[profile.release]
overflow-checks = true
