[package]
name = "qcore-js"
version = "0.10.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The JavaScript binding for the Quantova client core, generated over QCore with wasm-bindgen. The core does the key derivation, the post quantum signing, and the wire, the page does the fetch."
repository = "https://github.com/Quantova/QCore.js"

[lib]
crate-type = ["cdylib"]

[dependencies]
qcore = { path = "../QCore.rs", default-features = false }
wasm-bindgen = "0.2"
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9cabd50a4f88d0ce47a0f54517ace18e6975c879" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9cabd50a4f88d0ce47a0f54517ace18e6975c879" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "9cabd50a4f88d0ce47a0f54517ace18e6975c879" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4e37c52984740f345f96e2c8536803bce5f3b805" }

[profile.release]
overflow-checks = true
