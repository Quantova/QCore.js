[package]
name = "qcore-js"
version = "0.5.2"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The JavaScript binding for the Quantova client core, generated over QCore with wasm-bindgen. The core does the key derivation, the post quantum signing, and the wire, the page does the fetch."
repository = "https://github.com/Quantova/QCore-JS"

[lib]
crate-type = ["cdylib"]

[dependencies]
qcore = { path = "../QCore.rs", default-features = false }
wasm-bindgen = "0.2"
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "90ed5c76ec3022f4ba4c8d5881c744082a960e98" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "90ed5c76ec3022f4ba4c8d5881c744082a960e98" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "90ed5c76ec3022f4ba4c8d5881c744082a960e98" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "03d1702150ed41f8db78d69affe0ce6565b1724c" }
