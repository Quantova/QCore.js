[package]
name = "qcore-js"
version = "0.9.4"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The JavaScript binding for the Quantova client core, generated over QCore with wasm-bindgen. The core does the key derivation, the post quantum signing, and the wire, the page does the fetch."
repository = "https://github.com/Quantova/QCore-JS"

[lib]
crate-type = ["cdylib"]

[dependencies]
qcore = { path = "../QCore.rs", default-features = false }
wasm-bindgen = "0.2"
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "10d52af9de5de215a6e5359f36d5358d79a966cc" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "10d52af9de5de215a6e5359f36d5358d79a966cc" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "10d52af9de5de215a6e5359f36d5358d79a966cc" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "46f70778a505a495adb3a1805620802b380ce465" }
