[package]
name = "qcore-js"
version = "0.1.23"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The JavaScript binding for the Quantova client core, generated over QCore with wasm-bindgen. The core does the key derivation, the post quantum signing, and the wire, the page does the fetch."
repository = "https://github.com/Quantova/QCore-JS"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The one core. Its pure part, no input or output, is what compiles to WebAssembly, so
# the client feature is off and the browser does the transport.
qcore = { path = "../QCore.rs", default-features = false }
wasm-bindgen = "0.2"
qtv-wipe = { path = "../Quantova-Chain/crates/qtv-wipe" }
qtv-tx = { path = "../Quantova-Chain/crates/qtv-tx" }
qtv-account = { path = "../Quantova-Chain/crates/qtv-account" }
qtv-codec = { path = "../Quantova-Chain/crates/qtv-codec" }
qtv-idfmt = { path = "../Quantova-Chain/crates/qtv-idfmt" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "33c7e9395ad23f07019909470d319211213e904f" }
