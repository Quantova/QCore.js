[package]
name = "qcore-js"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The JavaScript binding for the Quantova client core, generated over QCore with wasm-bindgen. The core does the key derivation, the post quantum signing, and the wire, the page does the fetch."
repository = "https://github.com/Quantova/QCore-JS"

[lib]
crate-type = ["cdylib"]

[dependencies]
qcore = { path = "../QCore.rs", default-features = false }
wasm-bindgen = "0.2"
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "c6697ba56d86316d8c3d5968fbe6b5ab3ad1df04" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "c6697ba56d86316d8c3d5968fbe6b5ab3ad1df04" }
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "c6697ba56d86316d8c3d5968fbe6b5ab3ad1df04" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "e47d6cd94e71c13b22e2990f8c2b0a2e3a2204d0" }
