[package]
name = "qcore-js"
version = "0.1.31"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The JavaScript binding for the Quantova client core, generated over QCore with wasm-bindgen. The core does the key derivation, the post quantum signing, and the wire, the page does the fetch."
repository = "https://github.com/Quantova/QCore-JS"

[lib]
crate-type = ["cdylib"]

[dependencies]
qcore = { path = "../QCore.rs", default-features = false }
wasm-bindgen = "0.2"
qtv-wipe = { path = "../Quantova-Chain/crates/qtv-wipe" }
qtv-tx = { path = "../Quantova-Chain/crates/qtv-tx" }
qtv-idfmt = { path = "../Quantova-Chain/crates/qtv-idfmt" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "37a7a4963888a4bb0854d346583e26928659aa63" }
