name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: QCore.js
          persist-credentials: false
      - name: resolve cross repo pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          pin() { awk -v k="$1" '$1==k{print $2}' QCore.js/cross-repo-pins; }
          for k in Q-Crypto Quantova-Chain QVM QRC-CONSENSUS QCore.rs; do
            v=$(pin "$k")
            case "$v" in
              *[!0-9a-f]* | "") echo "cross-repo-pins $k is not a commit: '$v'" >&2; exit 1 ;;
            esac
            if [ "${#v}" -ne 40 ]; then
              echo "cross-repo-pins $k must name a full commit, not '$v'" >&2; exit 1
            fi
          done
          for k in Q-Crypto Quantova-Chain QVM QRC-CONSENSUS; do
            locked=$(grep -oE "$k\\.git\\?rev=[0-9a-f]{40}" QCore.js/Cargo.lock | sed "s/.*rev=//" | sort -u)
            if [ "$locked" != "$(pin "$k")" ]; then
              echo "Cargo.lock $k does not match the pinned $(pin "$k")" >&2
              echo "$locked" >&2
              exit 1
            fi
          done
          echo "qcore_rs=$(pin QCore.rs)" >> "$GITHUB_OUTPUT"
          echo "quantova_chain=$(pin Quantova-Chain)" >> "$GITHUB_OUTPUT"
          echo "qvm=$(pin QVM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: ${{ steps.pins.outputs.qcore_rs }}
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/Quantova-Chain
          ref: ${{ steps.pins.outputs.quantova_chain }}
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: ${{ steps.pins.outputs.qvm }}
          path: QVM
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: rebuild wasm from source
        working-directory: QCore.js
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
          bash scripts/build.sh
      - name: keep the rebuilt core
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rebuilt-core
          path: |
            QCore.js/pkg
            QCore.js/pkg-node
      - name: test
        working-directory: QCore.js
        run: |
          npm ci
          npm test
      - name: lint
        if: always()
        working-directory: QCore.js
        run: |
          for f in index.js shared.js test*.js; do node --check "$f"; done
          node --check shared.mjs
          npx --no-install tsc --noEmit --skipLibCheck index.d.ts
          cargo fmt -- --check
          cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings
      - name: software bill of materials
        if: always()
        working-directory: QCore.js
        run: |
          npm sbom --sbom-format cyclonedx --package-lock-only > sbom.npm.json
          cargo metadata --format-version 1 --locked > sbom.cargo.json
      - name: keep the bill of materials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qcore-js-sbom
          path: |
            QCore.js/sbom.npm.json
            QCore.js/sbom.cargo.json
      - name: supply chain gate (cargo deny)
        if: always()
        working-directory: QCore.js
        run: |
          cargo install cargo-deny --version 0.19.9 --locked
          cargo deny --locked check bans sources advisories
      - name: the committed core must equal the rebuilt core on main
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        working-directory: QCore.js
        run: git diff --exit-code -- pkg pkg-node shared.mjs
