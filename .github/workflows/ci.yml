name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # Build the wasm from the Rust source so the tests exercise what the source produces, not a
      # committed binary. A blob that leaks a key or signs a foreign payload but still passes the
      # javascript conformance tests would otherwise slip through review and reach a release.
      - name: rebuild wasm from source
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
          bash scripts/build.sh
      - run: node test-conformance.js
      - run: node test-sign-validate.js
      - run: node test-transport.js
      - run: node test-fee-cap.js
      - run: node test-network.js
