name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: QCore.js
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: bb98040f55da606a2b0147f2c91bb867ca9e3908
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/Quantova-Chain
          ref: be36f1d7182044464eaa2a33ee579f38ae6e8ef8
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: 62fadd4ced98c4c4eb5042391aba54dabac51431
          path: QVM
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: rebuild wasm from source
        working-directory: QCore.js
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
          bash scripts/build.sh
      - name: supply chain gate (cargo deny)
        working-directory: QCore.js
        run: |
          cargo install cargo-deny --version 0.19.9 --locked
          cargo deny --locked check bans sources advisories
      - name: test
        working-directory: QCore.js
        run: npm test
