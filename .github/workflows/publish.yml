name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Rebuild the ml-dsa crypto wasm from the Rust source in this trusted runner rather than
      # shipping the committed binary. Without this the published package would carry whatever
      # qcore_js_bg.wasm sits in the tree, so a tampered blob committed without touching the
      # reviewed .rs source would be published under valid provenance. Building from source and
      # publishing the fresh output closes that supply chain path.
      - name: rebuild wasm from source
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
          bash scripts/build.sh
      - run: node test-conformance.js
      - run: node test-sign-validate.js
      - run: node test-transport.js
      - run: node test-fee-cap.js
      - run: node test-asset-guards.js
      - run: npm publish --provenance --access public
