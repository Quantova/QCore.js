name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: QCore.js
          persist-credentials: false
      - name: resolve cross repo pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          pin() { awk -v k="$1" '$1==k{print $2}' QCore.js/cross-repo-pins; }
          for k in QCore.rs Quantova-Chain QVM Q-Crypto; do
            v=$(pin "$k")
            case "$v" in
              *[!0-9a-f]* | "") echo "cross-repo-pins $k is not a commit: '$v'" >&2; exit 1 ;;
            esac
            if [ "${#v}" -ne 40 ]; then
              echo "cross-repo-pins $k must name a full commit, not '$v'" >&2; exit 1
            fi
          done
          pins_qc=$(pin Q-Crypto)
          lock_qc=$(grep -oE "Q-Crypto\\.git\\?rev=[0-9a-f]{40}" QCore.js/Cargo.lock | sed "s/.*rev=//" | sort -u)
          if [ -z "$lock_qc" ]; then
            echo "Cargo.lock names no Q-Crypto commit to check the pins against" >&2; exit 1
          fi
          if [ "$lock_qc" != "$pins_qc" ]; then
            echo "Cargo.lock Q-Crypto does not match the pinned $pins_qc:" >&2
            echo "$lock_qc" >&2
            exit 1
          fi
          echo "qcore_rs=$(pin QCore.rs)" >> "$GITHUB_OUTPUT"
          echo "quantova_chain=$(pin Quantova-Chain)" >> "$GITHUB_OUTPUT"
          echo "qvm=$(pin QVM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: ${{ steps.pins.outputs.qcore_rs }}
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/Quantova-Chain
          ref: ${{ steps.pins.outputs.quantova_chain }}
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: ${{ steps.pins.outputs.qvm }}
          path: QVM
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: rebuild wasm from source
        working-directory: QCore.js
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
          bash scripts/build.sh
          git diff --exit-code -- pkg pkg-node shared.mjs
      - name: the tag must name the version being published
        working-directory: QCore.js
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "publish runs only from a vX.Y.Z tag, refusing $GITHUB_REF" >&2; exit 1 ;;
          esac
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not name package version $declared" >&2; exit 1
          fi
      - name: test
        working-directory: QCore.js
        run: |
          set -euo pipefail
          npm ci
          npm test

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: publish the verified commit
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "publish runs only from a vX.Y.Z tag, refusing $GITHUB_REF" >&2; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the tagged commit $GITHUB_SHA is not on main, refusing to publish it" >&2; exit 1
          fi
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not name package version $declared" >&2; exit 1
          fi
          npm publish --provenance --access public --ignore-scripts
      - name: the published version must carry provenance for this tag and commit
        env:
          PKG: "@quantovainc/qcore"
          WORKFLOW_PATH: .github/workflows/publish.yml
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          url=""
          for _ in $(seq 1 120); do
            url=$(npm view "$PKG@$V" dist.attestations.url 2>/dev/null || true)
            [ -n "$url" ] && break
            sleep 10
          done
          [ -n "$url" ] || { echo "$PKG@$V shows no provenance attestation" >&2; exit 1; }
          integrity=$(npm view "$PKG@$V" dist.integrity)
          for _ in $(seq 1 40); do
            curl -sSf "$url" -o "$RUNNER_TEMP/attestations.json" 2>/dev/null && break
            rm -f "$RUNNER_TEMP/attestations.json"
            sleep 15
          done
          [ -s "$RUNNER_TEMP/attestations.json" ] || { echo "$PKG@$V attestation bundle is not served" >&2; exit 1; }
          node - "$RUNNER_TEMP/attestations.json" "$integrity" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" "$WORKFLOW_PATH" <<'JS'
          'use strict';
          const fs = require('fs');
          const [file, integrity, repo, sha, ref, path] = process.argv.slice(2);
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          const slsa = (doc.attestations || []).filter((a) => a.predicateType === 'https://slsa.dev/provenance/v1');
          if (slsa.length !== 1) throw new Error('expected one SLSA provenance attestation, found ' + slsa.length);
          const st = JSON.parse(Buffer.from(slsa[0].bundle.dsseEnvelope.payload, 'base64').toString('utf8'));
          const want = Buffer.from(integrity.replace(/^sha512-/, ''), 'base64').toString('hex');
          if (!st.subject || st.subject.length !== 1 || st.subject[0].digest.sha512 !== want) throw new Error('the attested subject is not the published tarball');
          const bd = st.predicate.buildDefinition;
          const wf = bd.externalParameters.workflow;
          if (wf.repository !== 'https://github.com/' + repo) throw new Error('built from ' + wf.repository + ', not ' + repo);
          if (wf.path !== path) throw new Error('built by ' + wf.path + ', not ' + path);
          if (wf.ref !== ref) throw new Error('built from ref ' + wf.ref + ', not ' + ref);
          const src = (bd.resolvedDependencies || []).find((d) => d.digest && d.digest.gitCommit);
          if (!src || src.digest.gitCommit !== sha) throw new Error('built from commit ' + (src && src.digest.gitCommit) + ', not ' + sha);
          console.log('provenance binds ' + st.subject[0].name + ' to ' + repo + ' ' + ref + ' at ' + sha);
          JS
