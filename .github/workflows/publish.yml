name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: QCore.js
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QCore.rs
          ref: 608658ee5c7c4c7e85933ac6b08243131016ba1c
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/Quantova-Chain
          ref: 2ec106731300355424d873c7d666ac15e9ee5be4
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QVM
          ref: db3c3b557c13bd2389b024cca4a2f747e44db5f9
          path: QVM
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: rebuild wasm from source
        working-directory: QCore.js
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
          bash scripts/build.sh
      - name: test and publish
        working-directory: QCore.js
        run: |
          node test-conformance.js
          node test-sign-validate.js
          node test-transport.js
          node test-fee-cap.js
          node test-asset-guards.js
          npm publish --provenance --access public
