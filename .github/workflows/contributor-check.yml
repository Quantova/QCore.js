name: contributor check

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  ai-disclosure:
    # Org owners and members pass straight through. Every outside contributor is bound.
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: enforce the AI disclosure
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          yes_count=$(printf '%s\n' "$BODY" | grep -ciE '\[x\][[:space:]]*AI tools helped' || true)
          no_count=$(printf '%s\n' "$BODY" | grep -ciE '\[x\][[:space:]]*No AI tools were used' || true)
          if [ $((yes_count + no_count)) -ne 1 ]; then
            echo "::error::Tick exactly one AI box in the pull request description. Undeclared AI use closes the pull request."
            exit 1
          fi
          if [ "$yes_count" -eq 1 ]; then
            echo "AI ASSISTED. $AUTHOR declares AI tools helped. A maintainer must review every line before merge." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::AI assisted pull request from $AUTHOR. A maintainer must review every line before merge."
            exit 1
          fi
          echo "$AUTHOR declares that no AI tools were used" >> "$GITHUB_STEP_SUMMARY"
